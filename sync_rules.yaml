bucket_definitions:

  global:
    data:
      - SELECT * FROM price_list WHERE visible = true

  # TECHNICIAN: Only their assigned work orders
  # request.jwt() ->> 'emp_id' to extract emp_id from JWT
  technician_work_orders:
    parameters: SELECT request.jwt() ->> 'emp_id' AS emp_id
    data:
      - SELECT * FROM hc_patient_visit_detail 
        WHERE assigned_id = bucket.emp_id
          AND visible = true
          # AND visit_date >= CURRENT_DATE - INTERVAL '7 days'
          # AND visit_date <= CURRENT_DATE + INTERVAL '7 days'

  # MANAGER: All work orders for their tenant
  manager_work_orders:
    parameters: SELECT request.jwt() ->> 'tenant_id' AS tenant_id
    data:
      - SELECT * FROM hc_patient_visit_detail 
        WHERE tenant_id = bucket.tenant_id
          AND visible = true
          AND visit_date >= CURRENT_DATE - INTERVAL '7 days'
          AND visit_date <= CURRENT_DATE + INTERVAL '7 days'

  # BILLING: Finished work orders ready for billing
  billing_work_orders:
    parameters: SELECT request.jwt() ->> 'tenant_id' AS tenant_id
    data:
      - SELECT * FROM hc_patient_visit_detail 
        WHERE tenant_id = bucket.tenant_id
          AND visible = true
          AND status = 'Finished'
          AND server_status = 'Received'
          AND visit_date >= CURRENT_DATE - INTERVAL '7 days'
          AND visit_date <= CURRENT_DATE + INTERVAL '7 days'