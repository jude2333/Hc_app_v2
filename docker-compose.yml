services:
  postgres:
    image: postgres:16
    container_name: anderson_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: live_db2
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anderson_network

  mongo:
    image: mongo:7
    container_name: anderson_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anderson_network

  mongo-rs-init:
    image: mongo:7
    container_name: anderson_mongo_init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        sleep 5
        mongosh --host mongo:27017 --eval 'try{rs.status().ok && quit(0)} catch {} rs.initiate({_id: "rs0", version: 1, members: [{ _id: 0, host: "mongo:27017" }]})'
    restart: "no"
    networks:
      - anderson_network

  powersync:
    image: journeyapps/powersync-service:latest
    container_name: anderson_powersync
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    ports:
      - "8181:8080"
    volumes:
      - ./config:/config:ro
    restart: unless-stopped
    networks:
      - anderson_network

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: anderson_postgrest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:root@postgres:5432/live_db2
      PGRST_DB_SCHEMA: data
      PGRST_DB_ANON_ROLE: postgres
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
    ports:
      - "3001:3000"  
    restart: unless-stopped
    networks:
      - anderson_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: anderson_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@anderson.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anderson_network

volumes:
  postgres_data:
  mongo_data:
  pgadmin_data:

networks:
  anderson_network:
    driver: bridge
