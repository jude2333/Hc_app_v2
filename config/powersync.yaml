# PowerSync Self-Hosted Configuration
# official PowerSync docs: https://docs.powersync.com/self-hosting

# Database Replication Settings
replication:
  connections:
    - type: postgresql
      uri: postgres://postgres:root@postgres:5432/live_db2
      sslmode: disable
      publication_name: powersync

# Sync Bucket Storage mongodb
storage:
  type: mongodb
  uri: mongodb://mongo:27017/powersync_anderson?replicaSet=rs0

# API Port
port: 8080

# Sync Rules
# sync_rules:
#   content: |
#     bucket_definitions:
#       manager_work_orders:
#         data:
#           - SELECT * FROM data.hc_patient_visit_detail 
#             WHERE tenant_id = 1
#             AND visible = true
#             AND visit_date >= '2022-12-10'
#             AND visit_date <= '2022-12-23'

#       price_list:
#         data:
#           - SELECT * FROM data.price_list
#             WHERE visible = true        

sync_rules:
  content: |
    bucket_definitions:
      global:
        data:
          - SELECT * FROM data.price_list WHERE visible = true

      technician_work_orders:
        parameters: SELECT request.jwt() ->> 'emp_id' AS emp_id
        data:
          - SELECT * FROM data.hc_patient_visit_detail 
            WHERE assigned_id = bucket.emp_id
              AND visible = true

      manager_work_orders:
        parameters: SELECT request.jwt() ->> 'tenant_id' AS tenant_id
        data:
          - SELECT * FROM data.hc_patient_visit_detail 
            WHERE tenant_id::text = bucket.tenant_id
              AND visible = true
              AND sync_window = true

      billing_work_orders:
        parameters: SELECT request.jwt() ->> 'tenant_id' AS tenant_id
        data:
          - SELECT * FROM data.hc_patient_visit_detail 
            WHERE tenant_id::text = bucket.tenant_id
              AND visible = true
              AND status = 'Finished'
              AND server_status = 'Received'
              AND sync_window = true

