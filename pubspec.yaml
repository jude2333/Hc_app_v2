name: anderson_crm_flutter
description: "flutter crm"
publish_to: "none"

version: 1.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  dio: ^5.4.0
  device_info_plus: ^9.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.0
  intl: ^0.18.1
  go_router: ^13.0.0
  flutter_riverpod: ^2.4.9
  crypto: ^3.0.3
  encrypt: ^5.0.1
  cron: ^0.5.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.0.4
  permission_handler: ^11.1.0
  file_picker: ^10.3.3
  dart_jsonwebtoken: ^2.17.0
  provider: ^6.1.1

  # Location tracking
  geolocator: ^13.0.2
  flutter_background_service: ^5.0.14
  flutter_local_notifications: ^18.0.1
  battery_plus: ^6.0.3

  # Map display (manager dashboard)
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.0
  latlong2: ^0.9.1

  powersync: ^1.17.0

  # sqlite3: ^2.4.6
  # sqlite_async: ^0.12.2

  # Standard dependencies
  path_provider: ^2.1.4
  path: ^1.9.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  syncfusion_flutter_xlsio: ^27.2.5  # Excel export for analytics
  jose: ^0.3.4

  # File viewing
  flutter_pdfview: ^1.3.2
  photo_view: ^0.14.0
  open_filex: ^4.3.4

  # Web plugins
  flutter_web_plugins:
    sdk: flutter

  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.webp"
