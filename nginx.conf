user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm font/woff2;

    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    #  API Server 
    server {
        listen 80;
        server_name liveapi.andrsn.in;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 50M;

        location / {
            proxy_pass         http://127.0.0.1:3003;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
        }
    }

    #  pgAdmin 
    server {
        listen 80;
        server_name devdb.andrsn.click;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 100M;

        location / {
            proxy_pass         http://127.0.0.1:5050;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket — required for pgAdmin query console
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_read_timeout    300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout    300s;

            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    #  HC App (Flutter + Node) 
    server {
        listen 80;
        server_name hc-2.andrsn.in;

        root /home/ubuntu/app/hc_app_local/public;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        client_max_body_size 100M;

        # PowerSync workers + WASM — never cache
        location ~ \.(worker\.js|wasm)$ {
            try_files $uri @node;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Cross-Origin-Opener-Policy   "same-origin"         always;
            add_header Cross-Origin-Embedder-Policy "require-corp"        always;
        }

        # Content-hashed Flutter assets — cache forever
        location /assets/ {
            try_files $uri @node;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # CanvasKit engine — cache forever
        location /canvaskit/ {
            try_files $uri @node;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # Static files — Nginx serves directly
        location ~ \.(js|html|json|css|png|ico|woff2?|ttf|otf)$ {
            try_files $uri @node;
        }

        # Fallback to Node for API / WebSocket / SPA
        location @node {
            proxy_pass         http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri @node;
        }
    }

    # PowerSync 
   
    server {
        listen 80;
        server_name livesync.andrsn.in;

        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        location / {
            proxy_pass         http://127.0.0.1:8181;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout        86400s;
            proxy_buffering           off;
            proxy_cache               off;
            chunked_transfer_encoding on;
        }
    }

}
